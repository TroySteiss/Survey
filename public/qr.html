<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giveaway QR Code</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; margin:0; }
  body {
    font-family:"Inter", system-ui, sans-serif; min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(165deg,#0f2440 0%,#16325c 100%); padding:1.5rem;
  }
  .poster {
    background:#fff; border-radius:24px; padding:3rem 2.75rem; text-align:center;
    max-width:520px; width:100%; box-shadow:0 24px 60px rgba(8,18,36,.45);
  }
  .kicker { font-size:.8rem; letter-spacing:.24em; text-transform:uppercase; color:#b08a35; font-weight:600; }
  h1 { font-family:"Fraunces", Georgia, serif; font-size:2.4rem; color:#0f2440; margin:.4rem 0 .5rem; }
  p { color:#5b6779; font-size:1.05rem; margin-bottom:1.75rem; }
  img { width:100%; max-width:360px; height:auto; }
  .url { margin-top:1.5rem; font-size:.85rem; color:#9aa3b2; word-break:break-all; }
  @media print {
    body { background:#fff; padding:0; }
    .poster { box-shadow:none; max-width:100%; }
  }
</style>
</head>
<body>
<div class="poster">
  <div class="kicker">Resident Giveaway</div>
  <h1>Scan to Enter &#127942;</h1>
  <p>Point your phone camera at the code below</p>
  <img src="/qr.svg" alt="QR code for the giveaway entry form">
  <div class="url">giveaway-survey-production.up.railway.app</div>
</div>
</body>
</html>
